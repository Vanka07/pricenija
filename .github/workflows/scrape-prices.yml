name: Scrape commodity prices

on:
  schedule:
    # 14:00 WAT (UTC+1) — after typical market updates
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scripts/scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scripts/scraper
        run: npm ci

      - name: Require Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Missing GitHub secrets SUPABASE_URL and/or SUPABASE_SERVICE_KEY."
            echo "Add the PriceNija project URL and service role key, then re-run this workflow."
            exit 1
          fi

      - name: Run Commodity.ng scrape
        working-directory: scripts/scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node run-scraper.js --source=commodityng
